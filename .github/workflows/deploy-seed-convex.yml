name: Deploy Seed Convex

on:
  push:
    branches:
      - main
    paths:
      - domains/seed/convex/**
      - domains/seed/convex.json
      - domains/seed/package.json
      - packages/**
      - package.json
      - bun.lock
      - .github/workflows/deploy-seed-convex.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-seed-convex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Seed production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.SEED_CONVEX_DEPLOY_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Seed Convex
        run: bun run --filter @mcrl/seed typecheck:convex

      - name: Deploy Seed Convex
        working-directory: domains/seed
        run: bunx convex deploy
